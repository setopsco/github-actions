version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /setup
      - /deployment
      - /build-and-push-image
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /setup
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
