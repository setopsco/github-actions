version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /setup
      - /deployment
      - /build-and-push-image
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    assignees:
      - stefanvocke
    ignore:
      # Self-references to actions in this repo: every bump creates a new commit
      # on main, so the pinned SHA is always outdated again. Update these manually.
      - dependency-name: "setopsco/github-actions*"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /setup
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    assignees:
      - stefanvocke
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
